<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аруня ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eadcff,#b98cff,#8b5bd6);
  position:relative;
}
body:before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.35),transparent 35%),
             radial-gradient(circle at 80% 80%,rgba(255,120,220,.2),transparent 35%);
}
.card{
  position:relative; z-index:2; width:min(720px,92vw); min-height:430px;
  padding:42px 34px; border-radius:30px; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; color:white;
  box-shadow:0 25px 70px rgba(55,20,100,.45);
  background:
    linear-gradient(rgba(92,45,145,.72),rgba(70,25,120,.78)),
    url("Screenshot_321.png") center/cover no-repeat;
}
h1{font-size:clamp(30px,5vw,48px); margin:0 0 30px; text-shadow:0 3px 14px #35105d}
.reason{
  width:100%; min-height:120px; display:flex; align-items:center; justify-content:center;
  padding:25px; border-radius:22px; margin-bottom:25px;
  background:rgba(245,235,255,.94); color:#4d2878;
  font-size:clamp(21px,3vw,31px); font-weight:700; line-height:1.25;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);
}
button{
  border:0; border-radius:999px; padding:15px 32px; cursor:pointer;
  font-size:21px; font-weight:800; color:white;
  background:linear-gradient(135deg,#8e4de8,#c45ce8);
  box-shadow:0 9px 25px rgba(50,10,100,.35);
}
button:active{transform:scale(.96)}
#counter{margin-top:15px;font-weight:700;opacity:.9}
#hugBtn{background:linear-gradient(135deg,#ff62b7,#ff8bcf);margin-top:18px}
.hidden{display:none!important}
.heart{position:fixed;top:-30px;z-index:1;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
.fly{position:fixed;z-index:10;pointer-events:none;font-size:42px;animation:fly 1.7s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(25deg) scale(1.35);opacity:0}}
</style>
</head>
<body>
<main class="card">
  <h1 id="title">10 причин, почему ты мне нравишься</h1>
  <div id="reason" class="reason hidden"></div>
  <button id="btn">Жми ❤️</button>
  <div id="counter" class="hidden"></div>
  <button id="hugBtn" class="hidden">Обнять 🩷</button>
</main>

<script>
const reasons = ['ты интересная, киць с тобой я могу проводить дни', 'ты ассоциируешься у меня с милой мелкой обезьянкой которая любит ебашить бананы', 'ты классная', 'люблю тя котенок', 'люблю тя еще раз котенок', 'и еще раз', 'ну и еще разок', 'очень очень лю', 'прям очень.', 'и всегда буду'];
let index = -1;

const title = document.getElementById("title");
const reason = document.getElementById("reason");
const btn = document.getElementById("btn");
const counter = document.getElementById("counter");
const hugBtn = document.getElementById("hugBtn");

btn.addEventListener("click", () => {
  index++;

  // Slide 0 is the title + "Жми ❤️". First click opens reason 1.
  if (index < reasons.length) {
    title.textContent = "10 причин, почему ты мне нравишься";
    reason.classList.remove("hidden");
    reason.textContent = reasons[index];
    counter.classList.remove("hidden");
    counter.textContent = (index + 1) + " / 10";

    if (index === reasons.length - 1) {
      btn.classList.add("hidden");
      hugBtn.classList.remove("hidden");
    } else {
      btn.textContent = "Дальше ❤️";
    }
  }
});

hugBtn.addEventListener("click", () => {
  for (let n = 0; n < 28; n++) {
    const e = document.createElement("div");
    e.className = "fly";
    e.textContent = ["🫂","🤗","💗","💕","❤️"][Math.floor(Math.random()*5)];
    e.style.left = (45 + Math.random()*10) + "vw";
    e.style.top = (45 + Math.random()*10) + "vh";
    e.style.setProperty("--x", ((Math.random()-.5)*90) + "vw");
    e.style.setProperty("--y", ((Math.random()-.5)*80) + "vh");
    e.style.animationDelay = (Math.random()*.5) + "s";
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 2400);
  }
});

// Falling hearts
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = Math.random() > .5 ? "💜" : "❤️";
  h.style.left = Math.random()*100 + "vw";
  h.style.fontSize = (16 + Math.random()*22) + "px";
  h.style.animationDuration = (4 + Math.random()*4) + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 8500);
}, 450);
</script>
</body>
</html>
